name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Claude Code CLI (for manifest validation)
        run: npm install -g @anthropic-ai/claude-code
      - name: Install Pulser (for the example smoke tests)
        # Pinned deliberately: the examples assert on device constants Pulser
        # ships (AnalogDevice's C6 sets the printed R_b/a, its 38 µm radial cap
        # is what the 56-atom ring is expected to be refused by). A Pulser bump
        # can move those numbers, so it should arrive as its own PR.
        run: pip install "pulser==1.9.0"
      - name: Run repo checks
        run: bash scripts/check.sh
